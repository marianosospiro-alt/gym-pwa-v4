<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scheda palestra v4</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2ecc71; --dark: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 15px; }
        h1 { color: var(--primary); text-align: center; font-size: 1.4rem; margin-bottom: 20px; }
       .day-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; }
       .day-btn { background: var(--card); border: 2px solid transparent; color: #888; padding: 12px 20px; border-radius: 25px; cursor: pointer; white-space: nowrap; font-weight: bold; }
       .day-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
       .ex-card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 12px; border-left: 5px solid var(--primary); }
       .ex-title { font-weight: bold; font-size: 1.1rem; display: block; margin-bottom: 5px; }
       .ex-info { font-size: 0.85rem; color: #aaa; line-height: 1.3; margin-bottom: 10px; }
       .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input { background: #2d2d2d; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; font-size: 1rem; width: 85%; }
       .save-btn { background: var(--primary); color: white; border: none; padding: 20px; width: 100%; border-radius: 15px; font-weight: bold; font-size: 1.1rem; margin-top: 20px; cursor: pointer; }
        #chartBox { background: #fff; border-radius: 15px; padding: 10px; margin-top: 30px; display: none; height: 300px; }
    </style>
</head>
<body>
    <h1>STRATEGIA V4 PRO</h1>
    <div class="day-nav">
        <button class="day-btn active" onclick="loadDay(1)">1: PUSH</button>
        <button class="day-btn" onclick="loadDay(2)">2: PULL</button>
        <button class="day-btn" onclick="loadDay(3)">3: LEGS</button>
        <button class="day-btn" onclick="loadDay(4)">4: UPPER</button>
    </div>
    <div id="workoutArea"></div>
    <button class="save-btn" onclick="saveData()">SALVA SESSIONE</button>
    <div id="chartBox"><canvas id="progressChart"></canvas></div>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
