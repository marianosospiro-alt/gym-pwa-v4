<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymTracker v4</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2ecc71; --dark: #1a1a1a; --card: #2d2d2d; --text: #ffffff; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 15px; padding-bottom: 50px; }
        h1 { font-size: 1.5rem; color: var(--primary); text-align: center; }
       .day-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
       .day-btn { background: var(--card); border: 2px solid transparent; color: #aaa; padding: 10px 20px; border-radius: 25px; cursor: pointer; white-space: nowrap; font-weight: bold; transition: 0.3s; }
       .day-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
       .ex-card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--primary); }
       .ex-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
       .ex-info { font-size: 0.8rem; color: #bbb; line-height: 1.3; }
       .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
       .input-group { display: flex; flex-direction: column; gap: 5px; }
        input { background: #3d3d3d; border: 1px solid #555; color: white; padding: 10px; border-radius: 8px; font-size: 1rem; }
       .save-btn { background: var(--primary); color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; font-size: 1rem; margin-top: 20px; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3); }
        #chartBox { background: white; border-radius: 15px; padding: 10px; margin-top: 30px; display: none; }
    </style>
</head>
<body>
    <h1>STRATEGIA V4</h1>
    <div class="day-nav" id="nav">
        <button class="day-btn active" onclick="loadDay(1)">1: PUSH</button>
        <button class="day-btn" onclick="loadDay(2)">2: PULL</button>
        <button class="day-btn" onclick="loadDay(3)">3: LEGS</button>
        <button class="day-btn" onclick="loadDay(4)">4: UPPER</button>
    </div>
    <div id="workoutArea"></div>
    <button class="save-btn" onclick="saveData()">SALVA SESSIONE</button>
    <div id="chartBox">
        <canvas id="progressChart"></canvas>
    </div>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
