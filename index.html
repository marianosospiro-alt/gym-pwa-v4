<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PowerLog Pro v10.7</title>
    
    <link rel="apple-touch-icon" href="icon_gym.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root { 
            --apple-blue: #007AFF; 
            --apple-bg: #000000; 
            --apple-card: #111113; 
            --apple-green: #30D158; 
            --apple-purple: #BF5AF2; 
            --apple-red: #FF453A; 
            --apple-gray: #1C1C1E;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--apple-bg); 
            color: white; 
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.02em;
            overscroll-behavior: none;
        }

        .glass-nav { 
            background: rgba(10, 10, 12, 0.85); 
            backdrop-filter: blur(25px) saturate(160%); 
            -webkit-backdrop-filter: blur(25px) saturate(160%); 
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .apple-card { 
            background-color: var(--apple-card); 
            border-radius: 28px; 
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .btn-icon {
            background: #1C1C1E;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .btn-icon:active { transform: scale(0.9); }

        .input-log {
            background: #1C1C1E;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: white;
            font-weight: 800;
            padding: 8px 4px;
            font-size: 15px;
            text-align: center;
        }
        .input-log:focus { border-color: var(--apple-blue); outline: none; }

        .label-style {
            font-size: 9px;
            font-weight: 900;
            color: #48484A;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .img-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1C1C1E;
            position: relative;
            overflow: hidden;
            border-radius: 28px 28px 0 0;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }

        .img-thumb {
            width: 56px !important;
            height: 56px !important;
            border-radius: 12px;
            overflow: hidden;
            background: #2C2C2E;
            flex-shrink: 0;
            aspect-ratio: 1/1 !important;
        }
        .img-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .superset-link {
            width: 4px;
            height: 25px;
            background: linear-gradient(to bottom, var(--apple-purple), transparent);
            margin: -12px auto;
            position: relative;
            z-index: 1;
            border-radius: 2px;
        }

        .scroll-area { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        #toast {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 12px 24px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 13px;
            display: none;
            background: var(--apple-blue);
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.5);
            animation: popIn 0.3s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }

        @keyframes popIn { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

        .set-grid {
            display: grid;
            grid-template-cols: 0.6fr 1.2fr 1.2fr 1.2fr;
            gap: 8px;
            align-items: center;
        }
        
        .modal-sheet { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: none; align-items: flex-end; }
        .sheet-content { 
            background: #121214; 
            width: 100%; 
            border-top-left-radius: 35px; 
            border-top-right-radius: 35px; 
            padding: 28px; 
            max-height: 92vh; 
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="pt-safe pb-safe">
    <div id="toast"></div>

    <div id="app" class="max-w-md mx-auto min-h-screen relative overflow-hidden">
        
        <!-- HOME -->
        <div id="view-home" class="view p-6 pb-32 animate-slide">
            <header class="mb-10 flex justify-between items-center">
                <div>
                    <p id="date-label" class="label-style text-blue-500 mb-1"></p>
                    <h1 class="text-4xl font-black tracking-tight italic">PowerLog<span class="text-blue-500 text-2xl not-italic">.</span></h1>
                </div>
                <button onclick="openBiometrics()" class="btn-icon w-12 h-12 border border-white/5 shadow-2xl">
                    <i data-lucide="scale" class="text-white w-5 h-5"></i>
                </button>
            </header>

            <!-- V-TAPER DASHBOARD -->
            <section class="apple-card p-6 mb-10 bg-gradient-to-br from-[#18181b] to-[#09090b]">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="label-style">V-Taper Index</h2>
                        <p class="text-[10px] text-gray-500">Shoulder-to-Waist Ratio</p>
                    </div>
                    <span id="v-index-val" class="text-5xl font-black tracking-tighter text-blue-500">--</span>
                </div>
                <div class="grid grid-cols-3 gap-4 border-t border-white/5 pt-5">
                    <div class="text-center"><p class="label-style text-[8px] mb-1">PESO</p><p id="v-weight" class="font-bold text-sm">--</p></div>
                    <div class="text-center border-x border-white/5"><p class="label-style text-[8px] mb-1">SPALLE</p><p id="v-shoulders" class="font-bold text-sm">--</p></div>
                    <div class="text-center"><p class="label-style text-[8px] mb-1">VITA</p><p id="v-waist" class="font-bold text-sm">--</p></div>
                </div>
            </section>

            <section id="workout-cards-container" class="space-y-6"></section>
        </div>

        <!-- WORKOUT -->
        <div id="view-workout" class="view hidden pb-32">
            <header class="glass-nav sticky top-0 z-50 p-6 pt-14 flex justify-between items-center">
                <button onclick="goHome()" class="text-blue-500 font-bold active:scale-75 transition-all"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                <div class="text-center">
                    <h2 id="workout-title-text" class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-0.5">Sessione Attiva</h2>
                    <p id="session-timer" class="text-xl font-black tabular-nums tracking-tight">00:00:00</p>
                </div>
                <button onclick="finishWorkout()" class="bg-green-500 text-black text-[10px] font-black px-6 py-2.5 rounded-full shadow-lg">CONCLUDI</button>
            </header>

            <main id="exercise-list" class="p-4 space-y-8 mt-4 animate-slide"></main>

            <div class="p-4 space-y-6">
                <button onclick="openAddMenu()" class="w-full bg-[#1c1c1e] border border-dashed border-white/10 rounded-[35px] py-14 flex flex-col items-center gap-3 active:scale-95 transition-all">
                    <div class="w-14 h-14 bg-blue-500/10 rounded-full flex items-center justify-center">
                        <i data-lucide="plus" class="text-blue-500 w-7 h-7"></i>
                    </div>
                    <span class="label-style text-blue-500">Aggiungi Esercizio</span>
                </button>
                <textarea id="session-note" rows="3" placeholder="Note di fine allenamento..." class="apple-card p-5 text-sm w-full text-left bg-transparent border-white/10"></textarea>
            </div>
        </div>

        <!-- MODALI -->
        <div id="modal-edit-params" class="modal-sheet" onclick="closeEditParams()">
            <div class="sheet-content" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-2xl font-black italic">PARAMETRI</h3>
                    <button onclick="closeEditParams()" class="btn-icon w-10 h-10"><i data-lucide="x"></i></button>
                </div>
                <div class="space-y-8 pb-10">
                    <div class="grid grid-cols-2 gap-6">
                        <div><label class="label-style mb-2">Serie</label><input type="number" id="edit-sets" class="w-full text-2xl py-4 input-log"></div>
                        <div><label class="label-style mb-2">Target Reps</label><input type="text" id="edit-reps" class="w-full text-2xl py-4 input-log"></div>
                    </div>
                    <div><label class="label-style mb-2">Recupero (Sec)</label><input type="number" id="edit-rest" class="w-full text-2xl py-4 input-log"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <button id="btn-toggle-drop" onclick="tempDrop = !tempDrop; updateToggleUI()" class="py-5 rounded-2xl font-black uppercase text-[10px] bg-[#1C1C1E] border border-white/5">Drop Set: OFF</button>
                        <button id="btn-toggle-super" onclick="toggleSupersetLocal()" class="py-5 rounded-2xl font-black uppercase text-[10px] bg-[#1C1C1E] border border-white/5">Super Set: OFF</button>
                    </div>
                    <button onclick="confirmParams()" class="bg-blue-600 w-full py-5 text-white font-black rounded-2xl shadow-2xl shadow-blue-600/30">AGGIORNA</button>
                </div>
            </div>
        </div>

        <div id="modal-biometrics" class="modal-sheet" onclick="closeBiometrics()">
            <div class="sheet-content" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-3xl font-black italic tracking-tighter uppercase">Check-in Fisico</h3>
                    <button onclick="closeBiometrics()" class="btn-icon w-10 h-10"><i data-lucide="x"></i></button>
                </div>
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1"><label class="label-style px-2">Peso (kg)</label><input type="number" id="bio-weight" step="0.1" class="w-full input-log py-4 text-xl"></div>
                        <div class="space-y-1"><label class="label-style px-2">% Grasso</label><input type="number" id="bio-bf" step="0.1" class="w-full input-log py-4 text-xl"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="space-y-1"><label class="label-style text-center">Spalle</label><input type="number" id="bio-shoulders" class="w-full input-log py-4"></div>
                        <div class="space-y-1"><label class="label-style text-center">Vita</label><input type="number" id="bio-waist" class="w-full input-log py-4"></div>
                        <div class="space-y-1"><label class="label-style text-center">Braccio</label><input type="number" id="bio-arms" class="w-full input-log py-4"></div>
                    </div>
                    <button onclick="saveBiometrics()" class="bg-blue-600 w-full py-5 text-white font-black rounded-2xl mt-4">SALVA MISURE</button>
                </div>
            </div>
        </div>

        <div id="modal-library" class="modal-sheet" onclick="closeLibrary()">
            <div class="sheet-content h-[85vh]" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="library-title" class="text-2xl font-black">LIBRERIA</h3>
                    <button onclick="closeLibrary()" class="btn-icon w-10 h-10"><i data-lucide="x"></i></button>
                </div>
                <div id="library-categories" class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2"></div>
                <div class="scroll-area" id="library-list-container">
                    <div id="library-list" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <div id="modal-info" class="modal-sheet" onclick="closeInfo()">
            <div class="sheet-content" onclick="event.stopPropagation()">
                <div class="flex justify-between border-b border-white/5 pb-4 mb-6">
                    <h3 id="info-title" class="text-xl font-black italic uppercase">Focus Tecnico</h3>
                    <button onclick="closeInfo()" class="btn-icon w-10 h-10"><i data-lucide="x"></i></button>
                </div>
                <div id="info-content" class="space-y-5 pb-10"></div>
            </div>
        </div>

        <!-- NAVBAR -->
        <nav class="fixed bottom-0 left-0 right-0 glass-nav px-12 py-7 flex justify-around items-center z-50 pb-safe">
            <button onclick="goHome()" class="text-blue-500" id="nav-home"><i data-lucide="layout-grid" class="w-7 h-7"></i></button>
            <button onclick="exportData()" class="text-gray-600"><i data-lucide="download-cloud" class="w-7 h-7"></i></button>
            <button onclick="resetAllData()" class="text-gray-800"><i data-lucide="trash-2" class="w-7 h-7"></i></button>
        </nav>
    </div>

    <script>
        // --- DB INTEGRALE (38 Esercizi) ---
        const exerciseData = {
            'panca_piana': { name: 'Panca Piana', sets: 5, reps: '5-8', rest: 180, img: 'img/panca_piana.png', category: 'petto', coach: { esecuzione: "Scapole addotte, arco toracico, barra allo sterno.", target: "Massa pettorale centrale." } },
            'spinte_inc': { name: 'Spinte Inc. 30°', sets: 4, reps: '8-10', rest: 90, img: 'img/spinte_inc.png', category: 'petto', coach: { esecuzione: "Panca a 30°, stretch profondo, gomiti a 45°.", target: "Focus fasci alti." } },
            'croci_cavi_bassi': { name: 'Croci ai Cavi Bassi', sets: 3, reps: '12-15', rest: 60, img: 'img/croci_cavi_bassi.png', category: 'petto' },
            'croci_inc': { name: 'Croci Inclinata', sets: 3, reps: '12-15', rest: 75, img: 'img/croci_inc.png', category: 'petto' },
            'pectoral': { name: 'Pectoral Machine', sets: 4, reps: '12-15', rest: 75, img: 'img/pectoral.png', category: 'petto' },
            'crossover': { name: 'Crossover Cavi', sets: 3, reps: '15-20', rest: 60, img: 'img/crossover.png', category: 'petto' },
            'chest_press_g1': { name: 'Chest Press High', sets: 4, reps: '8-10', rest: 120, img: 'img/chest_press_g1.png', category: 'petto' },
            'chest_press_bassa': { name: 'Chest Press Low', sets: 4, reps: '12-15', rest: 75, img: 'img/chest_press.png', category: 'petto' },
            'dips_petto': { name: 'Dips Pettorali', sets: 3, reps: 'Max', rest: 120, img: 'img/dips_petto.png', category: 'petto' },
            'trazioni': { name: 'Trazioni Sbarra', sets: 5, reps: '6-8', rest: 120, img: 'img/trazioni.png', category: 'dorso', coach: { esecuzione: "Mento sopra la sbarra, controllo in discesa.", target: "Ampiezza ali dorsali." } },
            'tbar_row': { name: 'Rematore T-Bar', sets: 4, reps: '8-10', rest: 120, img: 'img/tbar_row.png', category: 'dorso' },
            'lat_machine_larga': { name: 'Lat Machine Larga', sets: 4, reps: '12-15', rest: 75, img: 'img/lat_larga.png', category: 'dorso' },
            'lat_machine_neutra': { name: 'Lat Machine Neutra', sets: 4, reps: '12-15', rest: 75, img: 'img/lat_neutra.png', category: 'dorso' },
            'pullover_manubrio': { name: 'Pullover Manubrio', sets: 3, reps: '12-15', rest: 90, img: 'img/pullover_manubrio.png', category: 'dorso' },
            'meadows_row': { name: 'Meadows Row', sets: 3, reps: '10-12', rest: 90, img: 'img/meadows_row.png', category: 'dorso' },
            'rematore_manubrio': { name: 'Rematore Manubrio', sets: 4, reps: '10-12', rest: 120, img: 'img/rematore_manubrio.png', category: 'dorso' },
            'lento_avanti': { name: 'Lento Bilanciere', sets: 4, reps: '6-8', rest: 120, img: 'img/lento_avanti.png', category: 'spalle' },
            'alzate_lat': { name: 'Alzate Laterali', sets: 3, reps: '10-12', rest: 75, img: 'img/alzate_lat.png', category: 'spalle' },
            'alzate_90': { name: 'Alzate a 90°', sets: 3, reps: '12-15', rest: 75, img: 'img/alzate_90.png', category: 'spalle' },
            'alzate_cavi': { name: 'Alzate ai Cavi', sets: 4, reps: '15-20', rest: 60, img: 'img/alzate_cavi.png', category: 'spalle' },
            'tirate_mento': { name: 'Tirate al Mento', sets: 3, reps: '12-15', rest: 75, img: 'img/tirate_mento.png', category: 'spalle' },
            'lu_raises': { name: 'Lu Raises', sets: 3, reps: '12-15', rest: 60, img: 'img/lu_raises.png', category: 'spalle' },
            'arnold_press': { name: 'Arnold Press', sets: 4, reps: '10-12', rest: 120, img: 'img/arnold_press.png', category: 'spalle' },
            'curl_ez': { name: 'Curl EZ', sets: 3, reps: '8-10', rest: 90, img: 'img/curl_ez.png', category: 'bicipiti' },
            'hammer_curl': { name: 'Hammer Curl', sets: 3, reps: '8-10', rest: 75, img: 'img/hammer_curl.png', category: 'bicipiti' },
            'spider_curl': { name: 'Spider Curl', sets: 3, reps: '10-12', rest: 75, img: 'img/spider_curl.png', category: 'bicipiti' },
            'curl_cavi': { name: 'Curl ai Cavi', sets: 3, reps: '12-15', rest: 90, img: 'img/curl_cavi.png', category: 'bicipiti' },
            'skullcrusher': { name: 'Skullcrusher', sets: 3, reps: '8-10', rest: 90, img: 'img/skullcrusher.png', category: 'tricipiti' },
            'pushdown': { name: 'Push Down Sbarra', sets: 3, reps: '10-12', rest: 75, img: 'img/pushdown.png', category: 'tricipiti' },
            'french_press': { name: 'French Press', sets: 3, reps: '10-12', rest: 90, img: 'img/french_press.png', category: 'tricipiti' },
            'hack_squat': { name: 'Hack Squat', sets: 4, reps: '10-12', rest: 120, img: 'img/hack_squat.png', category: 'gambe' },
            'leg_press': { name: 'Leg Press 45°', sets: 3, reps: '15-20', rest: 90, img: 'img/leg_press.png', category: 'gambe' },
            'hip_thrust': { name: 'Hip Thrust', sets: 3, reps: '12-15', rest: 90, img: 'img/hip_thrust.png', category: 'gambe' },
            'polpacci': { name: 'Polpacci Pressa', sets: 4, reps: '15-20', rest: 60, img: 'img/polpacci.png', category: 'gambe' },
            'leg_ext': { name: 'Leg Extension', sets: 3, reps: '15-20', rest: 60, img: 'img/leg_ext.png', category: 'gambe' },
            'russian_twist': { name: 'Russian Twist', sets: 3, reps: '15-20', rest: 60, img: 'img/russian_twist.png', category: 'core' },
            'hanging_leg': { name: 'Hanging Leg Raises', sets: 3, reps: '15-20', rest: 60, img: 'img/hanging_leg.png', category: 'core' },
            'plank': { name: 'Plank (Zavorra)', sets: 3, reps: 'Max', rest: 60, img: 'img/plank.png', category: 'core' }
        };

        const defaultPlan = {
            1: { title: 'PUSH (Forza)', color: '#007AFF', items: ['panca_piana', 'lento_avanti', 'spinte_inc', 'alzate_lat', 'skullcrusher', 'pushdown'], overrides: {} },
            2: { title: 'PULL (Forza)', color: '#AF52DE', items: ['trazioni', 'tbar_row', 'curl_ez', 'alzate_90', 'hammer_curl', 'russian_twist'], overrides: {} },
            3: { title: 'LEGS (Volume)', color: '#34C759', items: ['hack_squat', 'leg_press', 'hip_thrust', 'polpacci', 'leg_ext', 'hanging_leg', 'plank'], overrides: {} },
            4: { title: 'UPPER (Hyper)', color: '#FF9500', items: ['pectoral', 'lat_machine_larga', 'alzate_cavi', 'tirate_mento', 'crossover', 'curl_cavi'], overrides: {} }
        };

        // --- STATO ---
        let userPlan = JSON.parse(localStorage.getItem('user_workout_plan')) || defaultPlan;
        let biometrics = JSON.parse(localStorage.getItem('biometrics')) || { weight: [], shoulders: [], waist: [], arms: [], bf: [] };
        let activeSession = {}; 
        let currentWorkoutId = null;
        let startTime = null;
        let timerInterval = null;
        let editingIdx = null;
        let tempDrop = false, tempSuper = false;

        function showMessage(text) { 
            const b = document.getElementById('toast'); 
            b.innerText = text; b.style.display = 'block'; 
            setTimeout(()=>b.style.display = 'none', 3000); 
        }

        function handleImgError(el) {
            el.style.display = 'none';
            const icon = document.createElement('div');
            icon.className = "absolute inset-0 flex flex-col items-center justify-center opacity-20";
            icon.innerHTML = '<i data-lucide="dumbbell" class="w-12 h-12 mb-2"></i><span class="text-[8px] font-black uppercase tracking-tighter">Aesthetic View</span>';
            el.parentElement.appendChild(icon);
            lucide.createIcons();
        }

        // --- WORKOUT ---
        function openWorkout(id) {
            currentWorkoutId = id;
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-workout').classList.remove('hidden');
            document.getElementById('workout-title-text').innerText = userPlan[id].title;
            activeSession = {};
            startTime = Date.now();
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const diff = Date.now() - startTime;
                const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
                document.getElementById('session-timer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
            renderWorkout(id);
        }

        function renderWorkout(id) {
            const container = document.getElementById('exercise-list');
            const items = userPlan[id].items;
            const overrides = userPlan[id].overrides || {};
            
            container.innerHTML = items.map((exId, idx) => {
                const ex = exerciseData[exId] || { name: exId, sets: 3, reps: '12', rest: 60, img: '' };
                const ov = overrides[idx] || {};
                const setsNum = parseInt(ov.sets || ex.sets);
                const restTime = ov.rest !== undefined ? ov.rest : ex.rest;
                const isSuper = ov.isSuperset || false;

                let setsHtml = `<div class="set-grid mb-3"><span class="label-style text-center">SET</span><span class="label-style text-center">KG</span><span class="label-style text-center">REPS</span><span class="label-style text-center">RPE</span></div>`;
                for(let i=1; i<=setsNum; i++) {
                    const sessionKey = `${exId}_s${i}`;
                    const val = activeSession[sessionKey] || { w: '', r: '', rpe: '' };
                    setsHtml += `
                        <div class="set-grid mb-2.5">
                            <span class="text-[10px] font-black text-gray-700 text-center">${i}</span>
                            <input type="number" class="input-log" placeholder="--" value="${val.w}" onchange="logSet('${exId}', ${i}, 'w', this.value)">
                            <input type="number" class="input-log" placeholder="--" value="${val.r}" onchange="logSet('${exId}', ${i}, 'r', this.value)">
                            <select class="input-log text-[9px] font-black" onchange="logSet('${exId}', ${i}, 'rpe', this.value)">
                                <option value="">-</option>${[10,9,8,7,6].map(v => `<option value="${v}" ${val.rpe==v ? 'selected' : ''}>${v}</option>`).join('')}
                            </select>
                        </div>`;
                }

                return `
                <div class="flex flex-col">
                    <div class="apple-card overflow-hidden">
                        <div class="img-container">
                            <img src="${ex.img}" onerror="handleImgError(this)">
                            <div class="absolute top-5 right-5 flex gap-2.5">
                                <button onclick="openInfo('${exId}')" class="bg-black/70 p-3.5 rounded-full backdrop-blur-xl border border-white/10"><i data-lucide="info" class="w-4 h-4 text-white"></i></button>
                                <button onclick="openLibrary(${idx}, '${ex.category}')" class="bg-black/70 p-3.5 rounded-full backdrop-blur-xl border border-white/10"><i data-lucide="refresh-cw" class="w-4 h-4 text-blue-400"></i></button>
                            </div>
                            ${ov.isDropSet ? `<div class="absolute top-5 left-5 bg-red-500 text-white text-[8px] font-black px-2.5 py-1 rounded-md shadow-2xl">DROP SET</div>` : ''}
                        </div>
                        <div class="p-7">
                            <div class="flex justify-between items-start mb-8">
                                <div>
                                    <h3 class="text-2xl font-black italic tracking-tighter uppercase leading-none mb-2">${ex.name}</h3>
                                    <div class="flex items-center gap-3">
                                        <span class="label-style text-blue-500 bg-blue-500/10 px-2 py-0.5 rounded-md">${ov.sets || ex.sets} x ${ov.reps || ex.reps}</span>
                                        <button onclick="openEditParams(${idx})" class="p-1.5 bg-white/5 rounded-lg active:scale-75 transition-all"><i data-lucide="edit-3" class="w-3.5 h-3.5 text-gray-500"></i></button>
                                    </div>
                                </div>
                                ${!isSuper ? `<button id="timer-${exId}" onclick="toggleTimer('${exId}', ${restTime})" class="bg-[#1C1C1E] border border-white/5 px-4 py-2.5 rounded-2xl text-[10px] font-black flex items-center gap-2 text-blue-500 shadow-xl"><i data-lucide="timer" class="w-4 h-4"></i> ${restTime}s</button>` : `<div class="text-purple-500 text-[10px] font-black uppercase flex items-center gap-1.5 bg-purple-500/10 px-4 py-2.5 rounded-2xl border border-purple-500/20"><i data-lucide="zap" class="w-4 h-4"></i> SUPER SET</div>`}
                            </div>
                            <div>${setsHtml}</div>
                        </div>
                    </div>
                    ${isSuper && idx < items.length-1 ? `<div class="superset-link"></div>` : ''}
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function logSet(exId, setNum, field, val) {
            const key = `${exId}_s${setNum}`;
            if(!activeSession[key]) activeSession[key] = { w: '', r: '', rpe: '' };
            activeSession[key][field] = val;
            if(field === 'w' && val > 0) {
                const h = JSON.parse(localStorage.getItem(`h_${exId}`)) || [];
                const m = h.length > 0 ? Math.max(...h.map(i => i.w)) : 0;
                if(val > m && m > 0) showMessage("🚀 NUOVO RECORD STORICO!");
            }
        }

        function finishWorkout() {
            if(Object.keys(activeSession).length === 0) return alert("Inserisci dati prima di chiudere.");
            const journal = JSON.parse(localStorage.getItem('workout_journal')) || {};
            const date = new Date().toISOString().split('T')[0];
            let v = 0;
            Object.entries(activeSession).forEach(([k, s]) => { if(s.w && s.r) v += (s.w * s.r); });
            Object.entries(activeSession).forEach(([k, s]) => {
                const id = k.split('_s')[0];
                if(s.w > 0) {
                    const h = JSON.parse(localStorage.getItem(`h_${id}`)) || [];
                    h.push({ d: date, w: parseFloat(s.w) });
                    localStorage.setItem(`h_${id}`, JSON.stringify(h.slice(-20)));
                }
            });
            journal[date] = { id: currentWorkoutId, title: userPlan[currentWorkoutId].title, volume: v, duration: document.getElementById('session-timer').innerText };
            localStorage.setItem('workout_journal', JSON.stringify(journal));
            clearInterval(timerInterval); goHome(); showMessage("Sessione salvata!");
        }

        // --- EDIT PARAMS ---
        function openEditParams(idx) {
            // Check robustezza: assicurati che currentWorkoutId e idx siano validi
            if (!currentWorkoutId || !userPlan[currentWorkoutId]) {
                console.error("Workout non trovato");
                return;
            }
            if (!userPlan[currentWorkoutId].overrides) userPlan[currentWorkoutId].overrides = {};
            
            editingIdx = idx;
            const exId = userPlan[currentWorkoutId].items[idx];
            const ov = userPlan[currentWorkoutId].overrides[idx] || {};
            const exBase = exerciseData[exId] || { sets: 3, reps: '10', rest: 60 };

            document.getElementById('edit-sets').value = ov.sets || exBase.sets;
            document.getElementById('edit-reps').value = ov.reps || exBase.reps;
            document.getElementById('edit-rest').value = ov.rest !== undefined ? ov.rest : exBase.rest;
            
            tempDrop = ov.isDropSet || false;
            tempSuper = ov.isSuperset || false;
            
            updateToggleUI();
            document.getElementById('modal-edit-params').style.display = 'flex';
        }

        function toggleSupersetLocal() { 
            tempSuper = !tempSuper; 
            if (tempSuper) document.getElementById('edit-rest').value = 0;
            else document.getElementById('edit-rest').value = exerciseData[userPlan[currentWorkoutId].items[editingIdx]]?.rest || 90;
            updateToggleUI(); 
        }

        function updateToggleUI() {
            const d = document.getElementById('btn-toggle-drop'), s = document.getElementById('btn-toggle-super');
            d.innerText = `Drop Set: ${tempDrop ? 'ON' : 'OFF'}`;
            d.style.background = tempDrop ? 'rgba(255,69,58,0.2)' : '#1C1C1E';
            d.style.color = tempDrop ? '#FF453A' : '#8E8E93';
            s.innerText = `Super Set: ${tempSuper ? 'ON' : 'OFF'}`;
            s.style.background = tempSuper ? 'rgba(191,90,242,0.2)' : '#1C1C1E';
            s.style.color = tempSuper ? '#BF5AF2' : '#8E8E93';
        }

        function confirmParams() {
            userPlan[currentWorkoutId].overrides[editingIdx] = { 
                sets: document.getElementById('edit-sets').value, 
                reps: document.getElementById('edit-reps').value, 
                rest: parseInt(document.getElementById('edit-rest').value), 
                isDropSet: tempDrop, 
                isSuperset: tempSuper 
            };
            localStorage.setItem('user_workout_plan', JSON.stringify(userPlan));
            document.getElementById('modal-edit-params').style.display = 'none';
            renderWorkout(currentWorkoutId);
            showMessage("Configurazione salvata");
        }

        function closeEditParams() { document.getElementById('modal-edit-params').style.display = 'none'; }

        // --- UTILS ---
        function goHome() { 
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden')); 
            document.getElementById('view-home').classList.remove('hidden'); 
            renderHomeCards(); updateVTaperUI();
        }

        function renderHomeCards() {
            const container = document.getElementById('workout-cards-container');
            container.innerHTML = Object.entries(userPlan).map(([id, p]) => `
                <div onclick="openWorkout('${id}')" class="apple-card relative h-48 overflow-hidden active:scale-[0.98] transition-all">
                    <div class="absolute inset-0 bg-gradient-to-br from-black/90 via-black/30 to-transparent p-9 flex flex-col justify-center z-10">
                        <p class="label-style text-[10px] mb-2" style="color: ${p.color}">GIORNO ${id}</p>
                        <h3 class="text-4xl font-black text-white italic tracking-tighter uppercase leading-none">${p.title}</h3>
                    </div>
                    <div class="absolute right-10 top-1/2 -translate-y-1/2 w-16 h-16 rounded-full bg-white/5 border border-white/10 flex items-center justify-center z-10 shadow-2xl">
                        <i data-lucide="play" class="text-white fill-white w-7 h-7"></i>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }

        function updateVTaperUI() {
            const last = (k) => biometrics[k].length > 0 ? biometrics[k][biometrics[k].length-1].v : 0;
            const w = last('weight'), s = last('shoulders'), waist = last('waist');
            document.getElementById('v-weight').innerText = (w || '--') + ' kg';
            document.getElementById('v-shoulders').innerText = (s || '--') + ' cm';
            document.getElementById('v-waist').innerText = (waist || '--') + ' cm';
            if(s > 0 && waist > 0) {
                const ratio = (s/waist).toFixed(2);
                document.getElementById('v-index-val').innerText = ratio;
            }
        }

        function openBiometrics() {
            const last = (k) => biometrics[k].length > 0 ? biometrics[k][biometrics[k].length-1].v : '';
            ['weight','bf','shoulders','waist','arms'].forEach(f => document.getElementById(`bio-${f}`).value = last(f));
            document.getElementById('modal-biometrics').style.display = 'flex';
        }
        function closeBiometrics() { document.getElementById('modal-biometrics').style.display = 'none'; }
        function saveBiometrics() {
            const d = new Date().toISOString().split('T')[0];
            ['weight','bf','shoulders','waist','arms'].forEach(f => {
                const v = document.getElementById(`bio-${f}`).value;
                if(v) biometrics[f].push({ d, v: parseFloat(v) });
            });
            localStorage.setItem('biometrics', JSON.stringify(biometrics));
            updateVTaperUI(); closeBiometrics(); showMessage("Misure aggiornate!");
        }

        function toggleTimer(id, sec) {
            const btn = document.getElementById(`timer-${id}`);
            if (activeTimers[id]) { clearInterval(activeTimers[id].int); delete activeTimers[id]; btn.innerHTML = `<i data-lucide="timer" class="w-4 h-4"></i> ${sec}s`; btn.style.color = 'var(--apple-blue)'; lucide.createIcons(); return; }
            let rem = sec; btn.style.color = '#FF9500';
            activeTimers[id] = { int: setInterval(() => { rem--; btn.innerHTML = `<i data-lucide="timer" class="w-4 h-4"></i> ${Math.floor(rem/60)}:${(rem%60).toString().padStart(2,'0')}`; lucide.createIcons(); if (rem <= 0) { clearInterval(activeTimers[id].int); delete activeTimers[id]; btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> GO!`; btn.style.color = '#30D158'; if (window.navigator.vibrate) window.navigator.vibrate([200, 100, 200]); } }, 1000) };
        }

        function openLibrary(idx, cat) { swappingIndex = idx; renderLibrary(cat); document.getElementById('modal-library').style.display = 'flex'; }
        function closeLibrary() { document.getElementById('modal-library').style.display = 'none'; }
        function renderLibrary(filter) { const cats = [...new Set(Object.values(exerciseData).map(e => e.category))].sort(); document.getElementById('library-categories').innerHTML = cats.map(c => `<button onclick="renderLibraryList('${c}')" class="px-6 py-3 rounded-full bg-[#1C1C1E] label-style ${filter === c ? 'bg-blue-600 text-white' : 'text-gray-500'}">${c}</button>`).join(''); renderLibraryList(filter || cats[0]); }
        function renderLibraryList(cat) { document.getElementById('library-list').innerHTML = Object.entries(exerciseData).filter(([id, data]) => data.category === cat).map(([id, ex]) => `<div onclick="confirmSelection('${id}')" class="apple-card p-5 flex items-center gap-5 active:bg-white/10"><div class="img-thumb"><img src="${ex.img}" onerror="this.style.display='none'"></div><div class="flex-1"><h4 class="text-lg font-black uppercase italic leading-none mb-1">${ex.name}</h4><p class="label-style text-gray-600">${ex.category}</p></div><i data-lucide="plus-circle" class="w-6 h-6 text-blue-500"></i></div>`).join(''); lucide.createIcons(); }
        function confirmSelection(newId) { if(swappingIndex === null) userPlan[currentWorkoutId].items.push(newId); else userPlan[currentWorkoutId].items[swappingIndex] = newId; localStorage.setItem('user_workout_plan', JSON.stringify(userPlan)); closeLibrary(); renderWorkout(currentWorkoutId); }
        function openAddMenu() { swappingIndex = null; renderLibrary(); document.getElementById('modal-library').style.display = 'flex'; }
        
        function openInfo(id) { 
            const ex = exerciseData[id]; 
            if(!ex) return; 
            document.getElementById('info-title').innerText = ex.name; 
            document.getElementById('info-content').innerHTML = `
                <div class="apple-card p-7 border border-blue-500/20 mb-4"><p class="label-style text-blue-500 mb-3">Esecuzione</p><p class="text-sm leading-relaxed">${ex.coach?.esecuzione || 'Esecuzione controllata e ROM completo.'}</p></div>
                <div class="apple-card p-7 border border-green-500/20"><p class="label-style text-green-500 mb-3">Obiettivo</p><p class="text-sm leading-relaxed">${ex.coach?.target || 'Ipertrofia specifica per il distretto ' + ex.category + '.'}</p></div>`; 
            document.getElementById('modal-info').style.display = 'flex'; 
            lucide.createIcons(); 
        }
        function closeInfo() { document.getElementById('modal-info').style.display = 'none'; }
        function exportData() { const dl = document.createElement('a'); dl.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage)); dl.download = "powerlog_pro_backup.json"; dl.click(); }
        function resetAllData() { if(confirm("Reset Totale? Perderai tutti i tuoi pesi.")) { localStorage.clear(); location.reload(); } }

        window.onload = () => {
            const d = new Date();
            document.getElementById('date-label').innerText = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
            goHome();
            lucide.createIcons();
        };
    </script>
</body>
</html>
