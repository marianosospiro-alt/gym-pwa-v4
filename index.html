<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PowerLog Pro</title>
    <!-- Icona App Personalizzata (Data URI SVG per visibilità immediata) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007AFF'/><path d='M30 70 L30 50 M50 70 L50 30 M70 70 L70 45' stroke='white' stroke-width='8' stroke-linecap='round'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        :root { --apple-blue: #007AFF; --apple-bg: #000000; --apple-card: #1C1C1E; }
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: var(--apple-bg); color: white; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
        .glass { background: rgba(28, 28, 30, 0.7); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); }
        .apple-card { background-color: var(--apple-card); border-radius: 24px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(255,255,255,0.05); }
        .btn-primary { background-color: var(--apple-blue); border-radius: 14px; font-weight: 600; }
        .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
        .calendar-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; font-size: 13px; font-weight: 600; position: relative; }
        .day-workout-dot { width: 4px; height: 4px; border-radius: 50%; position: absolute; bottom: 6px; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .animate-slide { animation: slide 0.3s ease-out; }
        @keyframes slide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-sheet { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: flex-end; }
        .sheet-content { background: #1C1C1E; width: 100%; border-top-left-radius: 32px; border-top-right-radius: 32px; padding: 24px; max-height: 85vh; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.1); }
        input[type="number"], textarea { background: #2C2C2E; border: none; border-radius: 12px; color: white; padding: 12px; text-align: center; font-size: 18px; font-weight: 700; width: 100%; }
        textarea { text-align: left; font-size: 14px; font-weight: 400; resize: none; }
        .img-box { background: #2C2C2E; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 200px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 4px 24px; margin: 0 -24px; scroll-snap-type: x mandatory; }
        .scroll-item { flex: 0 0 140px; scroll-snap-align: start; }
        #message-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 16px 24px; border-radius: 16px; background: rgba(255, 59, 48, 0.95); backdrop-filter: blur(10px); color: white; font-weight: 700; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; width: 90%; max-width: 400px; }
    </style>
</head>
<body class="pt-safe">
    <div id="message-box"></div>
    <div id="app" class="max-w-md mx-auto min-h-screen relative overflow-hidden text-white">
        
        <!-- VISTA HOME -->
        <div id="view-home" class="view p-6 pb-32 animate-slide">
            <header class="flex justify-between items-end mb-8">
                <div>
                    <p id="date-label" class="text-blue-500 font-bold text-xs uppercase tracking-widest mb-1"></p>
                    <h1 class="text-3xl font-extrabold tracking-tight">Riepilogo</h1>
                </div>
            </header>

            <section class="mb-10">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4 px-1">Trend Distretti</h2>
                <div class="horizontal-scroll no-scrollbar">
                    <div class="scroll-item apple-card p-4"><p class="text-[9px] font-bold text-gray-400 uppercase text-center mb-2">Volume Tot.</p><div class="h-14"><canvas id="chart-volume"></canvas></div></div>
                    <div class="scroll-item apple-card p-4"><p class="text-[9px] font-bold text-gray-400 uppercase text-center mb-2">Petto</p><div class="h-14"><canvas id="chart-petto"></canvas></div></div>
                    <div class="scroll-item apple-card p-4"><p class="text-[9px] font-bold text-gray-400 uppercase text-center mb-2">Dorso</p><div class="h-14"><canvas id="chart-dorso"></canvas></div></div>
                    <div class="scroll-item apple-card p-4"><p class="text-[9px] font-bold text-gray-400 uppercase text-center mb-2">Spalle</p><div class="h-14"><canvas id="chart-spalle"></canvas></div></div>
                    <div class="scroll-item apple-card p-4"><p class="text-[9px] font-bold text-gray-400 uppercase text-center mb-2">Gambe</p><div class="h-14"><canvas id="chart-gambe"></canvas></div></div>
                    <div class="scroll-item apple-card p-4"><p class="text-[9px] font-bold text-gray-400 uppercase text-center mb-2">Bicipiti</p><div class="h-14"><canvas id="chart-bicipiti"></canvas></div></div>
                    <div class="scroll-item apple-card p-4"><p class="text-[9px] font-bold text-gray-400 uppercase text-center mb-2">Tricipiti</p><div class="h-14"><canvas id="chart-tricipiti"></canvas></div></div>
                </div>
            </section>

            <section id="workout-cards-container" class="space-y-4"></section>
        </div>

        <!-- VISTA WORKOUT -->
        <div id="view-workout" class="view hidden pb-32">
            <header class="p-6 glass pt-12 flex justify-between items-center sticky top-0 z-50">
                <button onclick="goHome()" class="text-blue-500 flex items-center gap-1 font-semibold text-sm active:scale-90 transition-all"><i data-lucide="chevron-left" class="w-5 h-5"></i> Esci</button>
                <h2 id="workout-title-text" class="font-bold text-sm uppercase tracking-widest text-white text-center flex-1">Allenamento</h2>
                <button id="finish-btn" onclick="finishWorkout()" class="bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-full shadow-lg active:scale-90 transition-all">CONCLUDI</button>
            </header>
            <main id="exercise-list" class="p-4 space-y-8 mt-4 animate-slide"></main>
            
            <div class="p-4 space-y-4">
                <button onclick="openAddMenu()" class="w-full bg-white/5 border border-dashed border-white/20 rounded-2xl py-8 flex flex-col items-center justify-center gap-2 active:scale-[0.98] transition-all">
                    <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center">
                        <i data-lucide="plus" class="text-blue-500 w-6 h-6"></i>
                    </div>
                    <span class="text-xs font-bold text-blue-500 uppercase tracking-widest">Aggiungi un Esercizio Extra</span>
                </button>

                <div id="notes-area">
                    <div class="apple-card p-6">
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-3 text-center">Note di fine sessione</label>
                        <textarea id="session-note" rows="3" placeholder="Com'è andata oggi? Note su focus e pump..."></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- VISTA DIARIO -->
        <div id="view-calendar" class="view hidden p-6 pb-32 animate-slide">
            <h1 class="text-3xl font-extrabold text-white mb-8">Diario</h1>
            <div id="calendar-container" class="apple-card p-5 mb-8 text-white">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="calendar-month" class="font-bold text-lg">Mese</h3>
                    <div class="flex gap-4">
                        <button onclick="changeMonth(-1)" class="text-blue-500"><i data-lucide="chevron-left"></i></button>
                        <button onclick="changeMonth(1)" class="text-blue-500"><i data-lucide="chevron-right"></i></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 text-gray-500 text-[10px] font-bold uppercase mb-4 text-center">
                    <div>Lun</div><div>Mar</div><div>Mer</div><div>Gio</div><div>Ven</div><div>Sab</div><div>Dom</div>
                </div>
                <div id="calendar-days" class="grid grid-cols-7 gap-2 text-white"></div>
            </div>
            <div id="calendar-selection" class="space-y-4"></div>
        </div>

        <!-- VISTA IMPOSTAZIONI -->
        <div id="view-settings" class="view hidden p-6 pb-32 animate-slide">
            <h1 class="text-3xl font-extrabold text-white mb-8">Impostazioni</h1>
            <div class="apple-card p-6 mb-6 text-white">
                <h3 class="font-bold mb-2">Backup Dati</h3>
                <p class="text-xs text-gray-400 mb-6">Salva regolarmente il file JSON per non perdere i tuoi pesi.</p>
                <div class="flex flex-col gap-3">
                    <button onclick="exportData()" class="btn-primary py-3 flex items-center justify-center gap-2"><i data-lucide="download" class="w-4 h-4"></i> ESPORTA JSON</button>
                    <button onclick="document.getElementById('importFile').click()" class="bg-white/10 rounded-2xl py-3 flex items-center justify-center gap-2 font-bold text-sm"><i data-lucide="upload" class="w-4 h-4"></i> IMPORTA JSON</button>
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                </div>
            </div>
            <div class="apple-card p-6 border border-red-500/20">
                <h3 class="font-bold text-red-500 mb-2">Area Pericolo</h3>
                <button onclick="resetAllData()" class="text-red-500 text-xs font-bold bg-red-500/10 w-full py-3 rounded-xl border border-red-500/30">CANCELLA TUTTI I DATI</button>
            </div>
        </div>

        <!-- MODALE LIBRERIA -->
        <div id="modal-library" class="modal-sheet" onclick="closeLibrary()">
            <div class="sheet-content" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center mb-6 text-white">
                    <h3 id="library-title" class="text-xl font-bold">Libreria Esercizi</h3>
                    <button onclick="closeLibrary()" class="bg-white/10 p-2 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div id="library-categories" class="flex overflow-x-auto gap-2 no-scrollbar mb-6"></div>
                <div id="library-list" class="space-y-4 pb-10"></div>
            </div>
        </div>

        <!-- MODALE INFO COACH -->
        <div id="modal-info" class="modal-sheet" onclick="closeInfo()">
            <div class="sheet-content" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center mb-6 text-white border-b border-white/5 pb-4">
                    <h3 id="info-title" class="text-xl font-extrabold">Focus Tecnico</h3>
                    <button onclick="closeInfo()" class="bg-white/10 p-2 rounded-full text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div id="info-content" class="space-y-6 pb-12"></div>
            </div>
        </div>

        <!-- NAVBAR -->
        <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 px-12 py-4 flex justify-around items-center z-50 pb-safe">
            <button onclick="goHome()" id="nav-home" class="flex flex-col items-center gap-1 text-blue-500"><i data-lucide="layout-grid" class="w-6 h-6"></i><span class="text-[10px] font-bold uppercase">Home</span></button>
            <button onclick="openCalendar()" id="nav-calendar" class="flex flex-col items-center gap-1 text-gray-500"><i data-lucide="calendar" class="w-6 h-6"></i><span class="text-[10px] font-bold uppercase">Diario</span></button>
            <button onclick="openSettings()" id="nav-settings" class="flex flex-col items-center gap-1 text-gray-500"><i data-lucide="settings" class="w-6 h-6"></i><span class="text-[10px] font-bold uppercase">Opzioni</span></button>
        </nav>
    </div>

    <script>
        // --- DATABASE ESERCIZI AGGIORNATO (V-TAPER & ARMS SPECIALIZATION) ---
        const exerciseData = {
            // PETTO
            'panca_piana': { name: 'Panca Piana Bilanciere', sets: '5x5-8', target: '32.5kg', rest: 180, img: 'img/panca_piana.png', category: 'petto', coach: { esecuzione: "Arco moderato, scapole incollate. Scendi allo sterno.", target: "Massa pettorale centrale.", tempo: "3s discesa, 1s pausa, salita esplosiva." } },
            'chest_press_g1': { name: 'Chest Press', sets: '4x8-10', target: '35kg', rest: 120, img: 'img/chest_press_g1.png', category: 'petto' },
            'spinte_inc': { name: 'Spinte Inc. 30° Manubri', sets: '4x8-10', target: '26kg', rest: 90, img: 'img/spinte_inc.png', category: 'petto', coach: { esecuzione: "Panca a 30°. Gomiti a 45°. Stretch massimo.", target: "Petto alto per evitare l'effetto tozzo.", tempo: "4s negativa controllata." } },
            'croci_cavi_bassi': { name: 'Croci ai Cavi (Bassi)', sets: '3x12-15', target: '10kg', rest: 60, img: 'img/croci_cavi_bassi.png', category: 'petto', coach: { esecuzione: "Pulegge basse, tira verso il mento.", target: "Focus fasci clavicolari del petto.", tempo: "Squeeze di 1s al centro." } },
            
            // SPALLE
            'lento_avanti': { name: 'Lento Avanti Bilanciere', sets: '4x6-8', target: '22.5kg', rest: 120, img: 'img/lento_avanti.png', category: 'spalle', coach: { esecuzione: "Core teso. Barra sfiora il mento. Spingi sopra la testa.", target: "Forza pura e spalle larghe.", tempo: "Ritmo costante." } },
            'alzate_lat': { name: 'Alzate Laterali Manubri', sets: '3x10-12', target: '10kg', rest: 75, img: 'img/alzate_lat.png', category: 'spalle', coach: { esecuzione: "Mignolo in alto. Piano scapolare (braccia un po' avanti).", target: "Allargare le spalle (V-Shape).", tempo: "1s fermo in alto." } },
            'lu_raises': { name: 'Lu Raises (Piastre)', sets: '3x12-15', target: '5kg', rest: 60, img: 'img/lu_raises.png', category: 'spalle', coach: { esecuzione: "Braccia tese, movimento circolare completo fin sopra la testa.", target: "Stondatura 3D della spalla.", tempo: "Controllato." } },
            
            // DORSO
            'trazioni': { name: 'Trazioni Sbarra', sets: '5x6-8', target: 'Zavorra', rest: 120, img: 'img/trazioni.png', category: 'dorso', coach: { esecuzione: "Petto alla sbarra. Scapole giù.", target: "Dorsali larghi ('ali').", tempo: "3s discesa." } },
            'tbar_row': { name: 'Rematore T-Bar', sets: '4x8-10', target: '30kg', rest: 120, img: 'img/tbar_row.png', category: 'dorso', coach: { esecuzione: "Gomiti verso le tasche. Petto fermo sul pad.", target: "Spessore schiena e postura.", tempo: "Contrazione 1s." } },
            'pullover_manubrio': { name: 'Pullover Manubrio', sets: '3x12-15', target: '18kg', rest: 90, img: 'img/pullover_manubrio.png', category: 'dorso', coach: { esecuzione: "Disteso sulla panca, allunga il manubrio dietro la testa finché senti i lats.", target: "Allargamento cassa toracica e lats.", tempo: "Eccentrica lenta." } },
            
            // GAMBE
            'hack_squat': { name: 'Hack Squat', sets: '4x10-12', target: '65kg', rest: 120, img: 'img/hack_squat.png', category: 'gambe', coach: { esecuzione: "Piedi bassi per enfasi quadricipiti. Massima profondità.", target: "Gambe definite e potenti.", tempo: "Pausa 1s in basso (buco)." } },
            'polpacci_pressa': { name: 'Calf Raise Pressa', sets: '4x15-20', target: '80kg', rest: 45, img: 'img/polpacci.png', category: 'gambe', coach: { esecuzione: "Spingi solo con le punte. Stretch totale in basso.", target: "Dettaglio polpaccio.", tempo: "2s allungamento, 2s contrazione." } },
            
            // BICIPITI
            'curl_ez': { name: 'Curl Bilanciere EZ', sets: '3x8-10', target: '20kg', rest: 90, img: 'img/curl_ez.png', category: 'bicipiti', coach: { esecuzione: "Gomiti bloccati. Niente slancio.", target: "Spessore braccia.", tempo: "3s negativa." } },
            'spider_curl': { name: 'Spider Curl', sets: '3x10-12', target: '12kg', rest: 75, img: 'img/spider_curl.png', category: 'bicipiti', coach: { esecuzione: "Petto sulla panca. Isola il bicipite.", target: "Picco del bicipite.", tempo: "Squeeze 1s." } },
            'preacher_curl': { name: 'Curl Panca Scott', sets: '3x10-12', target: '15kg', rest: 90, img: 'img/preacher_curl.png', category: 'bicipiti', coach: { esecuzione: "Braccia appoggiate al pad. Non staccare le ascelle.", target: "Massimo isolamento.", tempo: "Controllo in estensione." } },
            
            // TRICIPITI
            'skullcrusher': { name: 'Skullcrusher Manubri', sets: '3x8-10', target: '14kg', rest: 90, img: 'img/skullcrusher.png', category: 'tricipiti', coach: { esecuzione: "Manubri verso le tempie.", target: "Volume tricipiti.", tempo: "Controllo massimo." } },
            'pushdown_fune': { name: 'Pushdown con Fune', sets: '3x12-15', target: '15kg', rest: 60, img: 'img/pushdown_fune.png', category: 'tricipiti', coach: { esecuzione: "Apri la fune verso l'esterno in basso.", target: "Capo laterale tricipite.", tempo: "Squeeze finale." } },
            
            // CORE
            'russian_twist': { name: 'Russian Twist', sets: '3x15-20', target: '10kg', rest: 60, img: 'img/russian_twist.png', category: 'core', coach: { esecuzione: "Ruota le spalle, non solo le mani. Gambe immobili.", target: "Addome a scacchiera ed obliqui scolpiti.", tempo: "Lento e brutale." } },
            'cable_crunch': { name: 'Crunch ai Cavi (Inginoc.)', sets: '3x15-20', target: '25kg', rest: 60, img: 'img/cable_crunch.png', category: 'core', coach: { esecuzione: "Arrotonda la schiena, porta i gomiti alle ginocchia.", target: "Ipertrofia retti addominali.", tempo: "Controllo." } },
            'hanging_leg': { name: 'Hanging Leg Raises', sets: '3x15-20', target: 'C.L.', rest: 60, img: 'img/hanging_leg.png', category: 'core' }
        };

        const defaultPlan = {
            1: { title: 'PUSH (Forza)', color: '#007AFF', img: 'img/panca_piana.png', items: ['panca_piana', 'lento_avanti', 'spinte_inc', 'alzate_lat', 'skullcrusher'] },
            2: { title: 'PULL (Forza)', color: '#AF52DE', img: 'img/trazioni.png', items: ['trazioni', 'tbar_row', 'curl_ez', 'spider_curl', 'russian_twist'] },
            3: { title: 'LEGS (Volume)', color: '#34C759', img: 'img/hack_squat.png', items: ['hack_squat', 'polpacci_pressa', 'hanging_leg'] },
            4: { title: 'IPERTROFIA', color: '#FF9500', img: 'img/chest_press_bassa', items: ['chest_press_bassa', 'lu_raises', 'pushdown_fune', 'cable_crunch'] }
        };

        // --- STATO GLOBALE ---
        let userPlan = JSON.parse(localStorage.getItem('user_workout_plan')) || defaultPlan;
        let activeSession = JSON.parse(localStorage.getItem('active_session_buffer')) || {};
        let activeTimers = {};
        let currentWorkoutId = null;
        let swappingIndex = null; 
        let calendarDate = new Date();
        let homeCharts = {}; 

        // --- UI UTILS ---
        function showMessage(text) {
            const box = document.getElementById('message-box');
            box.innerText = text; box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 3000);
        }

        // --- GESTORE IMMAGINI ---
        function handleImgError(el) {
            el.classList.add('hidden');
            const icon = document.createElement('div');
            icon.className = "absolute inset-0 flex items-center justify-center opacity-20";
            icon.innerHTML = '<i data-lucide="dumbbell" class="w-16 h-16"></i>';
            el.parentElement.appendChild(icon);
            lucide.createIcons();
        }

        // --- COACH INFO MODAL ---
        function openInfo(exId) {
            const ex = exerciseData[exId];
            if (!ex || !ex.coach) { showMessage("Focus tecnico in arrivo per questo esercizio!"); return; }
            const modal = document.getElementById('modal-info');
            const content = document.getElementById('info-content');
            document.getElementById('info-title').innerText = ex.name;
            content.innerHTML = `
                <div class="space-y-4">
                    <div class="apple-card p-5 bg-blue-500/5 border border-blue-500/10">
                        <h4 class="text-blue-500 font-bold text-[10px] uppercase mb-2 flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4"></i> Esecuzione</h4>
                        <p class="text-sm leading-relaxed text-white">${ex.coach.esecuzione}</p>
                    </div>
                    <div class="apple-card p-5 bg-green-500/5 border border-green-500/10">
                        <h4 class="text-green-500 font-bold text-[10px] uppercase mb-2 flex items-center gap-2"><i data-lucide="target" class="w-4 h-4"></i> Obiettivo Estetico</h4>
                        <p class="text-sm leading-relaxed text-white">${ex.coach.target}</p>
                    </div>
                    <div class="apple-card p-5 bg-orange-500/5 border border-orange-500/10">
                        <h4 class="text-orange-500 font-bold text-[10px] uppercase mb-2 flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4"></i> Ritmo & Tempo</h4>
                        <p class="text-sm leading-relaxed text-white">${ex.coach.tempo}</p>
                    </div>
                </div>`;
            modal.style.display = 'flex';
            lucide.createIcons();
        }
        function closeInfo() { document.getElementById('modal-info').style.display = 'none'; }

        // --- LIBRERIA ---
        function openAddMenu() { swappingIndex = null; document.getElementById('library-title').innerText = "Aggiungi Esercizio"; renderLibrary(); document.getElementById('modal-library').style.display = 'flex'; }
        function openLibrary(index, category) { swappingIndex = index; document.getElementById('library-title').innerText = "Cambia Esercizio"; renderLibrary(category); document.getElementById('modal-library').style.display = 'flex'; }
        function renderLibrary(filterCat = null) {
            const catContainer = document.getElementById('library-categories');
            const categories = [...new Set(Object.values(exerciseData).map(e => e.category))].sort();
            catContainer.innerHTML = categories.map(cat => `<button onclick="renderLibraryList('${cat}')" class="px-5 py-2.5 rounded-full bg-white/5 text-[10px] font-black uppercase tracking-widest whitespace-nowrap ${filterCat === cat ? 'bg-blue-500 text-white' : 'text-gray-400'}">${cat}</button>`).join('');
            renderLibraryList(filterCat || categories[0]);
        }
        function renderLibraryList(category) {
            const list = document.getElementById('library-list');
            const currentItems = userPlan[currentWorkoutId].items;
            const exercises = Object.entries(exerciseData).filter(([id, data]) => data.category === category).map(([id, data]) => ({ id, ...data }));
            list.innerHTML = exercises.map(ex => {
                const isPresent = currentItems.includes(ex.id);
                return `
                <div onclick="processSelection('${ex.id}')" class="apple-card p-4 flex items-center gap-4 border border-white/5 active:bg-blue-500/20 cursor-pointer">
                    <div class="w-14 h-14 rounded-xl overflow-hidden img-box flex-shrink-0">
                        <img src="${ex.img}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<i data-lucide=\'dumbbell\' class=\'w-6 h-6 text-gray-700\'></i>'; lucide.createIcons();">
                    </div>
                    <div class="flex-1 text-left">
                        <h4 class="font-bold text-sm text-white">${ex.name}</h4>
                        <p class="text-[10px] text-gray-500 uppercase font-black">${ex.sets}</p>
                    </div>
                    <i data-lucide="${isPresent ? 'alert-circle' : (swappingIndex === null ? 'plus' : 'refresh-cw')}" class="${isPresent ? 'text-red-500' : 'text-blue-500'} w-5 h-5"></i>
                </div>`;
            }).join('');
            lucide.createIcons();
        }
        function processSelection(newExId) {
            if (userPlan[currentWorkoutId].items.includes(newExId)) { showMessage("Esercizio già presente nella scheda!"); return; }
            if (swappingIndex === null) userPlan[currentWorkoutId].items.push(newExId);
            else userPlan[currentWorkoutId].items[swappingIndex] = newExId;
            localStorage.setItem('user_workout_plan', JSON.stringify(userPlan));
            closeLibrary(); renderWorkout(currentWorkoutId);
        }
        function closeLibrary() { document.getElementById('modal-library').style.display = 'none'; }

        // --- DASHBOARD CHARTS ---
        function renderDashboardCharts() {
            const categories = ['volume', 'petto', 'dorso', 'spalle', 'gambe', 'bicipiti', 'tricipiti'];
            const journal = JSON.parse(localStorage.getItem('workout_journal')) || {};
            const entries = Object.entries(journal).sort((a,b) => new Date(a[0]) - new Date(b[0])).slice(-10);
            categories.forEach(cat => {
                const canvas = document.getElementById(`chart-${cat}`); if (!canvas) return;
                if (homeCharts[cat]) homeCharts[cat].destroy();
                let points = entries.map(e => {
                    if (cat === 'volume') return e[1].volume || 0;
                    let sum = 0; Object.entries(e[1].exercises || {}).forEach(([id, w]) => { if (exerciseData[id]?.category === cat) sum += (parseFloat(w) || 0); });
                    return sum;
                });
                if (points.length < 5) while(points.length < 5) points.unshift(0);
                homeCharts[cat] = new Chart(canvas.getContext('2d'), { type: 'line', data: { labels: points.map((_,i)=>i), datasets: [{ data: points, borderColor: '#007AFF', borderWidth: 2, pointRadius: 0, tension: 0.4, spanGaps: true }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { display: false }, x: { display: false } }, plugins: { legend: { display: false } } } });
            });
        }

        // --- TIMER ---
        function toggleTimer(exId, seconds) {
            const btn = document.getElementById(`timer-${exId}`);
            if (activeTimers[exId]) { clearInterval(activeTimers[exId].interval); delete activeTimers[exId]; btn.innerHTML = `<i data-lucide="timer" class="w-3 h-3"></i> ${seconds}s`; btn.className = "bg-white/5 text-gray-400 text-[10px] font-black px-3 py-1.5 rounded-lg flex items-center gap-1"; lucide.createIcons(); return; }
            if (!seconds) return;
            let rem = seconds; btn.className = "bg-orange-500/20 text-orange-500 text-[10px] font-black px-3 py-1.5 rounded-lg flex items-center gap-1";
            activeTimers[exId] = { interval: setInterval(() => {
                rem--; btn.innerHTML = `<i data-lucide="timer" class="w-3 h-3"></i> ${Math.floor(rem/60)}:${(rem%60).toString().padStart(2,'0')}`; lucide.createIcons();
                if (rem <= 0) { clearInterval(activeTimers[exId].interval); delete activeTimers[exId]; btn.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> GO!`; btn.className = "bg-green-500 text-black text-[10px] font-black px-3 py-1.5 rounded-lg flex items-center gap-1"; if (window.navigator.vibrate) window.navigator.vibrate([200, 100, 200]); setTimeout(() => { btn.innerHTML = `<i data-lucide="timer" class="w-3 h-3"></i> ${seconds}s`; btn.className = "bg-white/5 text-gray-400 text-[10px] font-black px-3 py-1.5 rounded-lg flex items-center gap-1"; lucide.createIcons(); }, 5000); }
            }, 1000) };
        }

        // --- CORE WORKOUT ---
        function saveWeight(exId, val) {
            if (!val || isNaN(val)) return;
            const h = JSON.parse(localStorage.getItem(`h_${exId}`)) || [];
            h.push({ d: new Date().toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'}), w: parseFloat(val) });
            localStorage.setItem(`h_${exId}`, JSON.stringify(h.slice(-15)));
            activeSession[exId] = parseFloat(val);
            localStorage.setItem('active_session_buffer', JSON.stringify(activeSession));
            renderWorkout(currentWorkoutId);
        }
        function undoLastWeight(exId) {
            const h = JSON.parse(localStorage.getItem(`h_${exId}`)) || []; if (h.length > 0) { h.pop(); localStorage.setItem(`h_${exId}`, JSON.stringify(h)); delete activeSession[exId]; localStorage.setItem('active_session_buffer', JSON.stringify(activeSession)); renderWorkout(currentWorkoutId); renderDashboardCharts(); }
        }
        function finishWorkout() {
            if (Object.keys(activeSession).length === 0) return alert("Nessun peso inserito oggi.");
            const journal = JSON.parse(localStorage.getItem('workout_journal')) || {};
            const today = new Date().toISOString().split('T')[0];
            journal[today] = { id: currentWorkoutId, title: userPlan[currentWorkoutId].title, exercises: { ...activeSession }, note: document.getElementById('session-note').value, volume: Object.values(activeSession).reduce((a,b)=>a+b,0) };
            localStorage.setItem('workout_journal', JSON.stringify(journal));
            activeSession = {}; localStorage.removeItem('active_session_buffer'); goHome();
        }

        // --- RENDERING ---
        function goHome() { document.querySelectorAll('.view').forEach(v => v.classList.add('hidden')); document.getElementById('view-home').classList.remove('hidden'); updateNav('home'); renderHomeCards(); renderDashboardCharts(); }
        function openWorkout(id) { currentWorkoutId = id; document.querySelectorAll('.view').forEach(v => v.classList.add('hidden')); document.getElementById('view-workout').classList.remove('hidden'); document.getElementById('workout-title-text').innerText = userPlan[id].title; document.getElementById('session-note').value = ''; renderWorkout(id); }
        function openCalendar() { document.querySelectorAll('.view').forEach(v => v.classList.add('hidden')); document.getElementById('view-calendar').classList.remove('hidden'); updateNav('calendar'); renderCalendar(); }
        function openSettings() { document.querySelectorAll('.view').forEach(v => v.classList.add('hidden')); document.getElementById('view-settings').classList.remove('hidden'); updateNav('settings'); }
        function updateNav(active) { ['home', 'calendar', 'settings'].forEach(n => { const btn = document.getElementById(`nav-${n}`); if (btn) { btn.classList.toggle('text-blue-500', active === n); btn.classList.toggle('text-gray-500', active !== n); } }); }

        function renderWorkout(id, isHistory = false, hist = null) {
            const container = document.getElementById('exercise-list');
            const items = userPlan[id].items;
            document.getElementById('finish-btn').style.display = isHistory ? 'none' : 'block';
            container.innerHTML = items.map((exId, idx) => {
                const ex = exerciseData[exId] || { name: exId, sets: '--', target: '--', img: '', category: 'petto', rest: 60 };
                const h = JSON.parse(localStorage.getItem(`h_${exId}`)) || [];
                const last = h.length > 0 ? h[h.length-1].w : '--';
                const todayVal = isHistory ? (hist[exId] || '--') : (activeSession[exId] || '');
                return `
                <div class="apple-card overflow-hidden animate-slide mb-4">
                    <div class="relative h-48 img-box">
                        <img src="${ex.img}" class="w-full h-full object-cover opacity-80" onerror="handleImgError(this)">
                        <div class="absolute top-4 right-4 flex gap-2">
                            <button onclick="openInfo('${exId}')" class="bg-black/60 backdrop-blur-md p-3 rounded-full border border-white/10 active:scale-90 transition-all"><i data-lucide="info" class="w-4 h-4 text-white"></i></button>
                            ${!isHistory ? `<button onclick="openLibrary(${idx}, '${ex.category}')" class="bg-black/60 backdrop-blur-md p-3 rounded-full border border-white/10 active:scale-90 transition-all"><i data-lucide="refresh-cw" class="w-4 h-4 text-blue-400"></i></button>` : ''}
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-6 text-white">
                            <div><h3 class="text-xl font-bold">${ex.name}</h3><p class="text-xs font-bold text-blue-500 uppercase tracking-widest mt-1">${ex.sets} • Target ${ex.target}</p></div>
                            ${!isHistory ? `<button id="timer-${exId}" onclick="toggleTimer('${exId}', ${ex.rest})" class="bg-white/5 text-gray-400 text-[10px] font-black px-3 py-1.5 rounded-lg flex items-center gap-1 transition-all"><i data-lucide="timer" class="w-3 h-3"></i> ${ex.rest}s</button>` : ''}
                        </div>
                        ${isHistory ? `<div class="bg-blue-500/10 p-5 rounded-2xl text-center"><span class="text-4xl font-black text-white">${todayVal} <small class="text-sm">kg</small></span></div>` : `
                            <div class="flex items-center gap-4 bg-black/40 p-4 rounded-2xl border border-white/5">
                                <div class="flex-1"><div class="flex gap-2"><input type="number" id="in-${exId}" value="${todayVal}" placeholder="${last !== '--' ? last : '0'}"><button onclick="saveWeight('${exId}', document.getElementById('in-${exId}').value)" class="btn-primary px-5 text-xs text-white">OK</button>
                                ${todayVal ? `<button onclick="undoLastWeight('${exId}')" class="bg-red-500/20 text-red-500 px-3 rounded-xl"><i data-lucide="undo" class="w-4 h-4"></i></button>` : ''}</div></div>
                                <div class="w-[1px] h-10 bg-white/10"></div>
                                <div class="text-center px-2 cursor-pointer" onclick="showChart('${exId}', '${ex.name}')"><label class="text-[9px] font-bold text-gray-500 block uppercase">Ultimo</label><span class="text-xl font-black italic underline decoration-blue-500/30 text-white">${last}</span></div>
                            </div>
                        `}
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function renderHomeCards() {
            const container = document.getElementById('workout-cards-container');
            container.innerHTML = Object.entries(userPlan).map(([id, p]) => `
                <div onclick="openWorkout(${id})" class="apple-card relative h-32 overflow-hidden transform active:scale-[0.98] transition-all" style="background-color: ${p.color}15">
                    <img src="${p.img}" class="absolute inset-0 w-full h-full object-cover opacity-30" onerror="handleImgError(this)">
                    <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/30 to-transparent p-6 flex flex-col justify-center">
                        <p class="text-[10px] font-black uppercase mb-1" style="color: ${p.color}">Giorno ${id}</p>
                        <h3 class="text-2xl font-extrabold text-white">${p.title}</h3>
                    </div>
                    <div class="absolute right-6 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/5 flex items-center justify-center border border-white/10"><i data-lucide="play" class="w-5 h-5 text-white ml-0.5"></i></div>
                </div>`).join('');
            lucide.createIcons();
        }

        // --- BACKUP & CALENDAR ---
        function exportData() { const dl = document.createElement('a'); dl.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage)); dl.download = "powerlog_backup.json"; dl.click(); }
        function importData(e) { const r = new FileReader(); r.onload = (ev) => { const d = JSON.parse(ev.target.result); Object.entries(d).forEach(([k,v]) => localStorage.setItem(k, v)); location.reload(); }; r.readAsText(e.target.files[0]); }
        function resetAllData() { if(confirm("Reset totale? Perderai tutto.")) { localStorage.clear(); location.reload(); } }
        
        function renderCalendar() {
            const container = document.getElementById('calendar-days');
            const journal = JSON.parse(localStorage.getItem('workout_journal')) || {};
            container.innerHTML = '';
            const year = calendarDate.getFullYear(); const month = calendarDate.getMonth();
            document.getElementById('calendar-month').innerText = new Intl.DateTimeFormat('it-IT', { month: 'long', year: 'numeric' }).format(calendarDate);
            const offset = new Date(year, month, 1).getDay();
            for(let i=0; i<(offset === 0 ? 6 : offset - 1); i++) container.innerHTML += `<div></div>`;
            for(let d=1; d<=new Date(year, month + 1, 0).getDate(); d++) {
                const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const workout = journal[key];
                container.innerHTML += `<div onclick="selectDate('${key}')" class="calendar-day cursor-pointer hover:bg-white/10 ${new Date().toISOString().split('T')[0] === key ? 'border border-blue-500' : ''}">${d}${workout ? `<div class="day-workout-dot" style="background-color: ${defaultPlan[workout.id]?.color || '#fff'}"></div>` : ''}</div>`;
            }
        }
        function selectDate(key) {
            const workout = (JSON.parse(localStorage.getItem('workout_journal')) || {})[key];
            const display = document.getElementById('calendar-selection');
            if(!workout) return display.innerHTML = `<div class="apple-card p-8 text-center text-gray-500">Nessun allenamento registrato.</div>`;
            display.innerHTML = `<div onclick="viewPastWorkout(${workout.id}, '${key}')" class="apple-card p-5 flex flex-col cursor-pointer border-l-4 transition-all active:scale-95" style="border-left-color: ${defaultPlan[workout.id]?.color || '#fff'}"><div class="flex justify-between items-center"><div><h3 class="text-xl font-black text-white">${workout.title}</h3><p class="text-xs text-gray-400">${workout.volume || 0} kg totali</p></div><i data-lucide="chevron-right"></i></div></div>`;
            lucide.createIcons();
        }
        function viewPastWorkout(wid, dkey) { document.querySelectorAll('.view').forEach(v => v.classList.add('hidden')); document.getElementById('view-workout').classList.remove('hidden'); renderWorkout(wid, true, (JSON.parse(localStorage.getItem('workout_journal')) || {})[dkey].exercises); }
        function changeMonth(dir) { calendarDate.setMonth(calendarDate.getMonth() + dir); renderCalendar(); }
        function showChart(id, name) { document.getElementById('chart-modal').classList.remove('hidden'); document.getElementById('chart-title').innerText = name; const h = JSON.parse(localStorage.getItem(`h_${id}`)) || []; if (myChart) myChart.destroy(); myChart = new Chart(document.getElementById('progressChart').getContext('2d'), { type: 'line', data: { labels: h.map(i => i.d), datasets: [{ data: h.map(i => i.w), borderColor: '#007AFF', fill: true, backgroundColor: 'rgba(0,122,255,0.1)', tension: 0.4, spanGaps: true }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } }); }
        function closeChart() { document.getElementById('chart-modal').classList.add('hidden'); }
        let myChart = null;

        window.onload = () => {
            const d = new Date();
            document.getElementById('date-label').innerText = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
            goHome();
            lucide.createIcons();
        };
    </script>
</body>
</html>
